<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⭐ Games Hub · Premium Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #0a0e1a;
      color: #eef2f8;
      display: flex;
      min-height: 100vh;
    }
    :root {
      --brand: #00e5a0;
      --brand-2: #00b8d4;
      --brand-3: #7c3aed;
      --card: rgba(20, 27, 51, 0.85);
      --elev: rgba(30, 40, 70, 0.7);
      --border: rgba(0, 229, 160, 0.15);
      --text-dim: #94a3b8;
      --text-mute: #64748b;
      --success: #22c55e;
      --danger: #ef4444;
      --warn: #f59e0b;
    }
    /* ----- SIDEBAR ----- */
    .sidebar {
      width: 260px;
      background: rgba(12, 16, 30, 0.95);
      backdrop-filter: blur(12px);
      border-right: 1px solid var(--border);
      padding: 24px 14px;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      flex-shrink: 0;
      box-shadow: 8px 0 30px rgba(0,0,0,0.6);
    }
    .sidebar-brand {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      padding-bottom: 20px;
      border-bottom: 1px solid #1f2842;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar-brand i { -webkit-text-fill-color: var(--brand); font-size: 1.6rem; }
    .nav-section { margin-bottom: 22px; }
    .nav-section-title {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #4a5670;
      padding-left: 12px;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      color: #b9c4dd;
      font-weight: 500;
      transition: 0.2s;
      cursor: pointer;
      margin-bottom: 3px;
      text-decoration: none;
      font-size: 0.88rem;
    }
    .nav-item i { width: 20px; font-size: 1rem; color: #6b7a9a; transition: 0.2s; text-align: center; }
    .nav-item:hover { background: rgba(0, 229, 160, 0.08); color: white; }
    .nav-item:hover i { color: var(--brand); }
    .nav-item.active {
      background: rgba(0, 229, 160, 0.13);
      color: var(--brand);
      box-shadow: inset 3px 0 0 var(--brand);
    }
    .nav-item.active i { color: var(--brand); }
    .sidebar-footer {
      margin-top: auto;
      border-top: 1px solid #1f2842;
      padding-top: 16px;
      font-size: 0.7rem;
      color: #4a5670;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .live-dot {
      display: inline-block;
      width: 8px; height: 8px;
      background: var(--success);
      border-radius: 50%;
      margin-right: 6px;
      box-shadow: 0 0 12px rgba(34,197,94,0.5);
    }

    /* ----- MAIN ----- */
    .main-content {
      flex: 1;
      padding: 26px 30px 40px;
      max-width: 1200px;
      margin: 0 auto;
      min-width: 0;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
    }
    .page-header h1 {
      font-size: 1.7rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .page-header .sub {
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-top: 2px;
    }
    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 22px;
    }
    .card {
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 20px 22px 24px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px -8px rgba(0,0,0,0.6);
      transition: 0.25s ease;
    }
    .card:hover { border-color: rgba(0,229,160,0.3); }
    .card h2 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--brand);
      border-bottom: 1px solid #1f2842;
      padding-bottom: 12px;
    }
    .card h2 i { color: var(--brand); }

    .field-group { display: flex; flex-direction: column; gap: 12px; }
    .field-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      background: #0e1325;
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid #262f47;
    }
    .field-row label {
      font-weight: 500;
      font-size: 0.8rem;
      color: #b9c4dd;
      min-width: 90px;
      flex-shrink: 0;
    }
    .field-row input[type="text"],
    .field-row input[type="number"],
    .field-row input[type="email"],
    .field-row select {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 0.88rem;
      padding: 6px 0;
      outline: none;
      min-width: 60px;
      font-family: inherit;
    }
    .field-row input::placeholder { color: #5b6a8a; }
    .field-row select option { background: #0b0e1a; }

    /* Switch */
    .switch {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .switch input[type="checkbox"] {
      width: 38px; height: 22px;
      appearance: none;
      background: #2d3650;
      border-radius: 40px;
      position: relative;
      cursor: pointer;
      transition: 0.2s;
      flex-shrink: 0;
      outline: none;
    }
    .switch input[type="checkbox"]:checked { background: var(--brand); }
    .switch input[type="checkbox"]::after {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      background: white;
      border-radius: 50%;
      top: 3px; left: 3px;
      transition: 0.2s;
    }
    .switch input[type="checkbox"]:checked::after { left: 19px; }

    /* Buttons */
    .btn {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      border: none;
      color: #0a0e1a;
      font-weight: 700;
      padding: 9px 20px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      box-shadow: 0 4px 14px rgba(0,229,160,0.3);
      font-family: inherit;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,229,160,0.45); }
    .btn:active { transform: translateY(0); }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--brand);
      color: var(--brand);
      box-shadow: none;
    }
    .btn-outline:hover { background: rgba(0,229,160,0.08); }
    .btn-sm { padding: 5px 14px; font-size: 0.72rem; }
    .btn-danger {
      background: linear-gradient(135deg, var(--danger), #b91c1c);
      color: white;
      box-shadow: 0 4px 14px rgba(239,68,68,0.3);
    }
    .btn-danger:hover { box-shadow: 0 6px 18px rgba(239,68,68,0.45); }

    /* List items */
    .list-item {
      background: #0e1325;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      border-left: 3px solid var(--brand);
      gap: 8px;
    }
    .list-item .info {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 14px;
      font-size: 0.8rem;
      align-items: center;
    }
    .list-item .info strong { color: var(--brand); }

    .empty-state {
      color: var(--text-mute);
      font-style: italic;
      padding: 12px 0;
      text-align: center;
      font-size: 0.85rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: 700;
    }
    .pill-success { background: rgba(34,197,94,0.15); color: #4ade80; }
    .pill-warn { background: rgba(245,158,11,0.15); color: #fbbf24; }
    .pill-danger { background: rgba(239,68,68,0.15); color: #f87171; }
    .pill-info { background: rgba(59,130,246,0.15); color: #60a5fa; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      padding: 12px 24px;
      border-radius: 12px;
      border-left: 4px solid var(--brand);
      box-shadow: 0 12px 40px rgba(0,0,0,0.7);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 999;
      transform: translateY(80px);
      opacity: 0;
      transition: 0.3s ease;
      font-size: 0.85rem;
      max-width: 320px;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { border-left-color: var(--danger); }
    .toast.error i { color: var(--danger); }

    hr { border:none; border-top:1px solid #1f2842; margin:14px 0; }

    /* Divider text */
    .divider-text {
      color: var(--text-mute);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 6px 0;
      font-weight: 600;
    }

    /* Order badge */
    .order-badge {
      background: rgba(0,229,160,0.15);
      color: var(--brand);
      width: 24px;
      height: 24px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { width: 72px; padding: 16px 8px; }
      .sidebar-brand span,
      .nav-item span,
      .nav-section-title,
      .sidebar-footer div span:last-child { display: none; }
      .sidebar-brand { justify-content: center; padding-bottom: 14px; }
      .sidebar-brand i { font-size: 1.8rem; }
      .nav-item { justify-content: center; padding: 12px; }
      .nav-item i { font-size: 1.3rem; }
      .nav-section { margin-bottom: 12px; }
      .main-content { padding: 18px 14px; }
      .config-grid { grid-template-columns: 1fr; }
      .page-header h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

<!-- ============ SIDEBAR ============ -->
<nav class="sidebar">
  <div class="sidebar-brand">
    <i class="fas fa-crown"></i>
    <span>Games Hub</span>
  </div>

  <div class="nav-section">
    <div class="nav-section-title">Overview</div>
    <a class="nav-item active" data-page="dashboard"><i class="fas fa-th-large"></i><span>Dashboard</span></a>
  </div>

  <div class="nav-section">
    <div class="nav-section-title">Configuration</div>
    <a class="nav-item" data-page="ads"><i class="fas fa-ad"></i><span>Ad Networks</span></a>
    <a class="nav-item" data-page="games"><i class="fas fa-gamepad"></i><span>Games</span></a>
    <a class="nav-item" data-page="rewards"><i class="fas fa-coins"></i><span>Rewards</span></a>
  </div>

  <div class="nav-section">
    <div class="nav-section-title">Content</div>
    <a class="nav-item" data-page="content"><i class="fas fa-link"></i><span>Websites & Tasks</span></a>
    <a class="nav-item" data-page="banners"><i class="fas fa-images"></i><span>Banners</span></a>
  </div>

  <div class="nav-section">
    <div class="nav-section-title">Engagement</div>
    <a class="nav-item" data-page="notice"><i class="fas fa-bullhorn"></i><span>Notice & Referral</span></a>
    <a class="nav-item" data-page="country"><i class="fas fa-globe-americas"></i><span>Country Access</span></a>
  </div>

  <div class="sidebar-footer">
    <div><span class="live-dot"></span><span id="connStatus">Connected</span></div>
    <div><i class="far fa-clock"></i> <span id="lastUpdate">just now</span></div>
  </div>
</nav>

<!-- ============ MAIN ============ -->
<div class="main-content">
  <div class="page-header">
    <div>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="sub" id="pageSub">Manage your app from one place</div>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn btn-outline btn-sm" id="refreshBtn"><i class="fas fa-sync-alt"></i> Sync</button>
      <button class="btn btn-sm" id="saveAllBtn"><i class="fas fa-save"></i> Save All</button>
    </div>
  </div>

  <div id="pageContainer"></div>
</div>

<!-- ============ TOAST ============ -->
<div id="toast" class="toast">
  <i class="fas fa-check-circle" style="color:var(--brand);"></i>
  <span id="toastMsg">Saved</span>
</div>

<script>
(function() {
  "use strict";

  // ====================================================
  // FIREBASE
  // ====================================================
  const firebaseConfig = {
    apiKey: "AIzaSyBEvTvWy-hH1HHgjoOhUKkj-Dglm11Oc8U",
    authDomain: "cash-rewards-01-624ae.firebaseapp.com",
    projectId: "cash-rewards-01-624ae",
    storageBucket: "cash-rewards-01-624ae.firebasestorage.app",
    messagingSenderId: "29119912449",
    appId: "1:29119912449:web:e0c68c1994ff0a71603e00"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ====================================================
  // STATE — mirrors miniapp Firebase structure
  // ====================================================
  let appState = {
    // Games -> maps to config/games (miniapp keys: ludoDice, colorGame, watchVideo, tryYourLuck)
    games: {
      ludo:        { visible: true, dailyPlayLimit: 5, gameCost: 10, winMultiplier: 10 },
      color:       { visible: true, dailyPlayLimit: 8, rewardPerPlay: 100 },
      watch:       { visible: true, dailyPlayLimit: 10, rewardPerPlay: 50 },
      luck:        { visible: true, dailyPlayLimit: 3, rewardPerPlay: 500 },
      social:      { visible: true },
      visit:       { visible: true }
    },
    // Ads -> config/ads
    ads: {
      gigapub:              { enabled: true, order: 1 },
      adsgramReward:        { enabled: true, order: 2 },
      adsgramInterstitial:  { enabled: true, order: 3 }
    },
    // Rewards -> config/main
    rewards: {
      adWatch: 50,
      colorGame: 100,
      ludoMultiplier: 10,
      ludoGameCost: 10,
      luckReward: 500,
      socialReward: 30,
      visitReward: 15,
      minWithdraw: 1000,
      coinValueCoins: 1000,
      coinValueInr: 10,
      referralBonus: 100,
      adsgramRewardId: '21768',
      adsgramInterstitialId: 'int-21769'
    },
    lists: {
      websites: [],
      socialTasks: []
    },
    banners: [],
    country: { allowed: [], ipinfoToken: '', blockMessage: 'Not available in your country' },
    notice: { enabled: false, title: '', message: '', type: 'info', cancelable: true }
  };

  // ====================================================
  // NAVIGATION
  // ====================================================
  const pages = ['dashboard', 'ads', 'games', 'rewards', 'content', 'banners', 'notice', 'country'];
  const titles = {
    dashboard: ['Dashboard', 'Real-time overview'],
    ads:       ['Ad Networks', 'Control which ads are shown and in what order'],
    games:     ['Games & Limits', 'Visibility, cost, daily limits'],
    rewards:   ['Rewards & Coin Values', 'Points earned per action'],
    content:   ['Content Lists', 'Websites and social tasks'],
    banners:   ['Slider Banners', 'Home page carousel'],
    notice:    ['Notice & Referral', 'App-wide announcements'],
    country:   ['Country Access', 'Geo-blocking and IPinfo integration']
  };
  let currentPage = 'dashboard';

  function navigateTo(page) {
    if (!pages.includes(page)) return;
    currentPage = page;
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.querySelector(`.nav-item[data-page="${page}"]`)?.classList.add('active');
    const [title, sub] = titles[page] || ['Dashboard', ''];
    document.getElementById('pageTitle').textContent = title;
    document.getElementById('pageSub').textContent = sub;
    renderPage(page);
  }

  function renderPage(page) {
    const c = document.getElementById('pageContainer');
    switch (page) {
      case 'dashboard': renderDashboard(c); break;
      case 'ads':       renderAds(c); break;
      case 'games':     renderGames(c); break;
      case 'rewards':   renderRewards(c); break;
      case 'content':   renderContent(c); break;
      case 'banners':   renderBanners(c); break;
      case 'notice':    renderNotice(c); break;
      case 'country':   renderCountry(c); break;
    }
  }

  // ====================================================
  // DASHBOARD
  // ====================================================
  function renderDashboard(c) {
    const enabledAds = Object.entries(appState.ads).filter(([, v]) => v.enabled).length;
    const totalAds = Object.keys(appState.ads).length;
    c.innerHTML = `
      <div class="config-grid">
        <div class="card">
          <h2><i class="fas fa-chart-line"></i> Overview</h2>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
            <div style="background:#0e1325; border-radius:14px; padding:14px;">
              <div style="color:#8b9ac0; font-size:0.7rem;">Active Ads</div>
              <div style="font-size:1.6rem; font-weight:800; color:var(--brand);">${enabledAds}/${totalAds}</div>
            </div>
            <div style="background:#0e1325; border-radius:14px; padding:14px;">
              <div style="color:#8b9ac0; font-size:0.7rem;">Websites</div>
              <div style="font-size:1.6rem; font-weight:800; color:var(--brand);">${appState.lists.websites.length}</div>
            </div>
            <div style="background:#0e1325; border-radius:14px; padding:14px;">
              <div style="color:#8b9ac0; font-size:0.7rem;">Social Tasks</div>
              <div style="font-size:1.6rem; font-weight:800; color:var(--brand);">${appState.lists.socialTasks.length}</div>
            </div>
            <div style="background:#0e1325; border-radius:14px; padding:14px;">
              <div style="color:#8b9ac0; font-size:0.7rem;">Banners</div>
              <div style="font-size:1.6rem; font-weight:800; color:var(--brand);">${appState.banners.length}</div>
            </div>
          </div>
          <div style="margin-top:14px; background:#0e1325; border-radius:14px; padding:12px 14px; font-size:0.78rem;">
            <span style="color:#8b9ac0;">💎 Min Withdraw</span>
            <strong style="color:var(--brand);">${appState.rewards.minWithdraw}</strong>
            &nbsp;·&nbsp;
            <span style="color:#8b9ac0;">🪙 ${appState.rewards.coinValueCoins} coins = ₹${appState.rewards.coinValueInr}</span>
          </div>
        </div>

        <div class="card">
          <h2><i class="fas fa-bolt"></i> Quick Actions</h2>
          <div class="field-group">
            <button class="btn" id="quickResetBtn"><i class="fas fa-redo-alt"></i> Reset All Daily Limits</button>
            <button class="btn btn-outline" id="quickAdsBtn"><i class="fas fa-ad"></i> Manage Ad Networks</button>
            <button class="btn btn-outline" id="quickNoticeBtn"><i class="fas fa-bullhorn"></i> Publish Notice</button>
            <button class="btn btn-outline" id="quickResetVisitsBtn"><i class="fas fa-globe"></i> Reset Website Visits</button>
          </div>
        </div>

        <div class="card" style="grid-column: 1 / -1;">
          <h2><i class="fas fa-info-circle"></i> Ad Rotation Explained</h2>
          <p style="color:#8b9ac0; font-size:0.82rem; line-height:1.6;">
            The miniapp tries each <b>enabled</b> ad network in the order you set (lower number = tried first).
            If one fails or is unavailable, it automatically falls back to the next one. At least one network
            should be enabled for games to work.
          </p>
        </div>
      </div>
    `;
    document.getElementById('quickResetBtn').onclick = resetAllLimits;
    document.getElementById('quickAdsBtn').onclick = () => navigateTo('ads');
    document.getElementById('quickNoticeBtn').onclick = () => navigateTo('notice');
    document.getElementById('quickResetVisitsBtn').onclick = resetWebsiteVisits;
  }

  // ====================================================
  // AD NETWORKS  ⭐ NEW
  // ====================================================
  function renderAds(c) {
    const a = appState.ads;
    const providers = [
      { key: 'gigapub',             label: 'Gigapub',              desc: 'Rewarded/interstitial ad network' },
      { key: 'adsgramReward',       label: 'AdsGram Reward',       desc: 'Rewarded video (best conversion)' },
      { key: 'adsgramInterstitial', label: 'AdsGram Interstitial', desc: 'Full-screen interstitial' }
    ];

    c.innerHTML = `
      <div class="card" style="margin-bottom:20px;">
        <h2><i class="fas fa-ad"></i> Ad Network Rotation</h2>
        <p style="color:#8b9ac0; font-size:0.82rem; line-height:1.6; margin-bottom:16px;">
          Enable the ad networks you want. The miniapp tries them in the order shown below
          (lower number = tried first). If a network fails, it falls back to the next enabled one.
        </p>

        <div class="field-group">
          ${providers.map((p, i) => {
            const cfg = a[p.key] || { enabled: true, order: i + 1 };
            return `
              <div class="field-row" style="padding:12px 16px;">
                <div class="order-badge">${cfg.order}</div>
                <div style="flex:1; min-width:0;">
                  <div style="font-weight:700; font-size:0.9rem; color:#eef2f8;">${p.label}</div>
                  <div style="color:#6b7a9a; font-size:0.72rem; margin-top:2px;">${p.desc}</div>

  function saveAds() {
    const newAds = {};
    document.querySelectorAll('[data-ad]').forEach(cb => {
      const k = cb.dataset.ad;
      const orderEl = document.querySelector(`[data-ad-order="${k}"]`);
      newAds[k] = {
        enabled: cb.checked,
        order: parseInt(orderEl.value) || 1
      };
    });
    // Ensure at least one enabled
    if (!Object.values(newAds).some(v => v.enabled)) {
      showToast('❌ Enable at least one ad network', true);
      return;
    }
    appState.ads = newAds;
    db.collection('config').doc('ads').set(newAds, { merge: true })
      .then(() => {
        showToast('✅ Ad rotation saved');
        updateTimestamp();
        renderAds(document.getElementById('pageContainer'));
      })
      .catch(err => showToast('❌ ' + err.message, true));
  }

  function saveGames() {
    const newGames = JSON.parse(JSON.stringify(appState.games));
    document.querySelectorAll('[data-game-visible]').forEach(cb => {
      const k = cb.dataset.gameVisible;
      if (!newGames[k]) newGames[k] = {};
      newGames[k].visible = cb.checked;
    });
    document.querySelectorAll('[data-game-limit]').forEach(inp => {
      const k = inp.dataset.gameLimit;
      if (!newGames[k]) newGames[k] = {};
      newGames[k].dailyPlayLimit = parseInt(inp.value) || 0;
    });
    document.querySelectorAll('[data-game-extra]').forEach(inp => {
      const [k, field] = inp.dataset.gameExtra.split(':');
      if (!newGames[k]) newGames[k] = {};
      newGames[k][field] = parseFloat(inp.value) || 0;
    });

    appState.games = newGames;
    pushGamesToFirebase(newGames)
      .then(() => showToast('✅ Game config saved'))
      .catch(err => showToast('❌ ' + err.message, true));
  }

  /**
   * Push games in the miniapp format (config/games doc).
   * Miniapp uses: ludoDice, colorGame, watchVideo, tryYourLuck, socialTasks, visitWebsites
   */
  function pushGamesToFirebase(games) {
    const payload = {
      ludoDice: {
        visible: games.ludo.visible !== false,
        dailyPlayLimit: games.ludo.dailyPlayLimit || 0,
        gameCost: games.ludo.gameCost || 10,
        winMultiplier: games.ludo.winMultiplier || 10
      },
      colorGame: {
        visible: games.color.visible !== false,
        dailyPlayLimit: games.color.dailyPlayLimit || 0,
        rewardPerPlay: games.color.rewardPerPlay || 100
      },
      watchVideo: {
        visible: games.watch.visible !== false,
        dailyPlayLimit: games.watch.dailyPlayLimit || 0,
        rewardPerPlay: games.watch.rewardPerPlay || 50
      },
      tryYourLuck: {
        visible: games.luck.visible !== false,
        dailyPlayLimit: games.luck.dailyPlayLimit || 0,
        rewardPerPlay: games.luck.rewardPerPlay || 500
      },
      socialTasks: {
        visible: games.social.visible !== false
      },
      visitWebsites: {
        visible: games.visit.visible !== false
      },
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    return db.collection('config').doc('games').set(payload, { merge: true });
  }

      appState.notice.enabled = false;
      db.collection('config').doc('appNotice').set({ enabled: false }, { merge: true })
        .then(() => showToast('✅ Notice disabled'))
        .catch(err => showToast('❌ ' + err.message, true));
    };

    document.getElementById('saveReferralBtn').onclick = () => {
      const bonus = parseInt(document.getElementById('refBonus').value) || 100;
      const shareText = document.getElementById('refShareText').value.trim();
      appState.rewards.referralBonus = bonus;
      appState.rewards.referralShareText = shareText;
      db.collection('config').doc('main').set({
        referralBonus: bonus,
        referralShareText: shareText,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true })
        .then(() => showToast('✅ Referral saved'))
        .catch(err => showToast('❌ ' + err.message, true));
    };
  }

  // ====================================================
  // COUNTRY
  // ====================================================
  function renderCountry(c) {
    const co = appState.country;
    c.innerHTML = `
      <div class="card">
        <h2><i class="fas fa-globe-americas"></i> Country Access</h2>
        <div class="field-group">
          <div class="field-row">
            <label>Allowed (comma)</label>
            <input type="text" id="allowedCountries" value="${(co.allowed || []).join(',')}" placeholder="in,us,gb">
          </div>
          <div class="field-row">
            <label>IPinfo Token</label>
            <input type="text" id="ipinfoToken" value="${co.ipinfoToken || ''}" placeholder="optional">
          </div>
          <div class="field-row">
            <label>Block Message</label>
            <input type="text" id="blockMessage" value="${co.blockMessage || ''}" placeholder="Not available in your country">
          </div>
          <button class="btn" id="saveCountryBtn"><i class="fas fa-save"></i> Save Country Settings</button>
        </div>
        <p style="color:#6b7a9a; font-size:0.72rem; margin-top:12px; line-height:1.5;">
          Leave "Allowed" empty to allow all countries. Lowercase ISO-2 codes.
        </p>
      </div>
    `;

    document.getElementById('saveCountryBtn').onclick = () => {
      const raw = document.getElementById('allowedCountries').value;
      const allowed = raw.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
      const ipinfoToken = document.getElementById('ipinfoToken').value.trim();
      const blockMessage = document.getElementById('blockMessage').value.trim();
      appState.country = { allowed, ipinfoToken, blockMessage };
      db.collection('config').doc('main').set({
        allowedCountries: allowed,
        ipinfoApiToken: ipinfoToken,
        blockedCountryMessage: blockMessage,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true })
        .then(() => showToast('✅ Country settings saved'))
        .catch(err => showToast('❌ ' + err.message, true));
    };
  }

  // ====================================================
  // ACTIONS
  // ====================================================
  function resetAllLimits() {
    if (!confirm('Reset all daily limits for every user? This affects the miniapp immediately.')) return;
    const today = new Date().toISOString().slice(0, 10);
    db.collection('config').doc('resetFlags').set({
      full_reset_date: today,
      ludoDice_reset_date: today,
      colorGame_reset_date: today,
      watchVideo_reset_date: today,
      tryYourLuck_reset_date: today
    }, { merge: true })
      .then(() => showToast('♻️ All limits reset'))
      .catch(err => showToast('❌ ' + err.message, true));
  }

  function resetWebsiteVisits() {
    if (!confirm('Reset website visit history for all users?')) return;
    db.collection('config').doc('main').set({
      lastWebsiteResetDate: new Date().toISOString().slice(0, 10)
    }, { merge: true })
      .then(() => showToast('✅ Website visits reset'))
      .catch(err => showToast('❌ ' + err.message, true));
  }

  // ====================================================
  // FIREBASE LOAD
  // ====================================================
  async function loadFromFirebase() {
    try {
      const [mainSnap, gamesSnap, adsSnap, noticeSnap] = await Promise.all([
        db.collection('config').doc('main').get(),
        db.collection('config').doc('games').get(),
        db.collection('config').doc('ads').get(),
        db.collection('config').doc('appNotice').get()
      ]);

      // ---- config/main ----
      if (mainSnap.exists) {
        const d = mainSnap.data();

        // Rewards (map miniapp keys -> admin keys)
        if (d.adWatchReward !== undefined) appState.rewards.adWatch = d.adWatchReward;
        if (d.colorGameReward !== undefined) appState.rewards.colorGame = d.colorGameReward;
        if (d.ludoGameCost !== undefined) appState.rewards.ludoGameCost = d.ludoGameCost;
        if (d.ludoWinMultiplier !== undefined) appState.rewards.ludoMultiplier = d.ludoWinMultiplier;
        if (d.tryYourLuckReward !== undefined) appState.rewards.luckReward = d.tryYourLuckReward;
        if (d.socialReward !== undefined) appState.rewards.socialReward = d.socialReward;
        if (d.visitReward !== undefined) appState.rewards.visitReward = d.visitReward;
        if (d.minWithdrawal !== undefined) appState.rewards.minWithdraw = d.minWithdrawal;
        if (d.coinValueCoins !== undefined) appState.rewards.coinValueCoins = d.coinValueCoins;
        if (d.coinValueInr !== undefined) appState.rewards.coinValueInr = d.coinValueInr;
        if (d.referralBonus !== undefined) appState.rewards.referralBonus = d.referralBonus;
        if (d.referralShareText !== undefined) appState.rewards.referralShareText = d.referralShareText;
        if (d.adsgramRewardId !== undefined) appState.rewards.adsgramRewardId = d.adsgramRewardId;
        if (d.adsgramInterstitialId !== undefined) appState.rewards.adsgramInterstitialId = d.adsgramInterstitialId;
        if (d.gigapubScriptId !== undefined) appState.rewards.gigapubScriptId = d.gigapubScriptId;

        // Lists
        if (Array.isArray(d.websitesToVisit)) appState.lists.websites = d.websitesToVisit;
        if (Array.isArray(d.socialTasks)) appState.lists.socialTasks = d.socialTasks;

        // Banners
        if (Array.isArray(d.sliderBanners)) appState.banners = d.sliderBanners;

        // Country
        if (Array.isArray(d.allowedCountries)) appState.country.allowed = d.allowedCountries;
        if (d.ipinfoApiToken !== undefined) appState.country.ipinfoToken = d.ipinfoApiToken;
        if (d.blockedCountryMessage !== undefined) appState.country.blockMessage = d.blockedCountryMessage;

        // Payment methods (optional)
        if (Array.isArray(d.paymentMethods)) appState.rewards.paymentMethods = d.paymentMethods;
      }

      // ---- config/games ----
      if (gamesSnap.exists) {
        const g = gamesSnap.data();
        // Map miniapp keys -> admin keys
        if (g.ludoDice) {
          appState.games.ludo = {
            visible: g.ludoDice.visible !== false,
            dailyPlayLimit: g.ludoDice.dailyPlayLimit || 0,
            gameCost: g.ludoDice.gameCost || 10,
            winMultiplier: g.ludoDice.winMultiplier || 10
          };
        }
        if (g.colorGame) {
          appState.games.color = {
            visible: g.colorGame.visible !== false,
            dailyPlayLimit: g.colorGame.dailyPlayLimit || 0,
            rewardPerPlay: g.colorGame.rewardPerPlay || 100
          };
        }
        if (g.watchVideo) {
          appState.games.watch = {
            visible: g.watchVideo.visible !== false,
            dailyPlayLimit: g.watchVideo.dailyPlayLimit || 0,
            rewardPerPlay: g.watchVideo.rewardPerPlay || 50
          };
        }
        if (g.tryYourLuck) {
          appState.games.luck = {
            visible: g.tryYourLuck.visible !== false,
            dailyPlayLimit: g.tryYourLuck.dailyPlayLimit || 0,
            rewardPerPlay: g.tryYourLuck.rewardPerPlay || 500
          };
        }
        if (g.socialTasks) appState.games.social = { visible: g.socialTasks.visible !== false };
        if (g.visitWebsites) appState.games.visit = { visible: g.visitWebsites.visible !== false };
      }

      // ---- config/ads ----
      if (adsSnap.exists) {
        const a = adsSnap.data();
        appState.ads = {
          gigapub:              { enabled: a.gigapub?.enabled !== false,             order: a.gigapub?.order || 1 },
          adsgramReward:        { enabled: a.adsgramReward?.enabled !== false,       order: a.adsgramReward?.order || 2 },
          adsgramInterstitial:  { enabled: a.adsgramInterstitial?.enabled !== false, order: a.adsgramInterstitial?.order || 3 }
        };
      }

      // ---- config/appNotice ----
      if (noticeSnap.exists) {
        const n = noticeSnap.data();
        appState.notice = {
          enabled: n.enabled || false,
          title: n.title || '',
          message: n.message || '',
          type: n.type || 'info',
          cancelable: n.cancelable !== false
        };
      }

      updateTimestamp();
      renderPage(currentPage);
      showToast('✅ Synced with Firebase');
    } catch (e) {
      console.error('Load error:', e);
      renderPage(currentPage);
      showToast('⚠️ Using local defaults', true);
    }
  }

  // ====================================================
  // TOAST / TIMESTAMP
  // ====================================================
  function showToast(msg, isError = false) {
    const el = document.getElementById('toast');
    const icon = el.querySelector('i');
    document.getElementById('toastMsg').textContent = msg;
    el.classList.toggle('error', isError);
    icon.className = isError ? 'fas fa-times-circle' : 'fas fa-check-circle';
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 2800);
  }

  function updateTimestamp() {
    document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
  }

  // ====================================================
  // INIT
  // ====================================================
  document.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      navigateTo(el.dataset.page);
    });
  });

  document.getElementById('refreshBtn').onclick = () => loadFromFirebase();

  document.getElementById('saveAllBtn').onclick = async () => {
    try {
      await pushGamesToFirebase(appState.games);
      await db.collection('config').doc('ads').set(appState.ads, { merge: true });
      await db.collection('config').doc('main').set({
        adWatchReward: appState.rewards.adWatch,
        colorGameReward: appState.rewards.colorGame,
        ludoGameCost: appState.rewards.ludoGameCost,
        ludoWinMultiplier: appState.rewards.ludoMultiplier,
        tryYourLuckReward: appState.rewards.luckReward,
        socialReward: appState.rewards.socialReward,
        visitReward: appState.rewards.visitReward,
        minWithdrawal: appState.rewards.minWithdraw,
        coinValueCoins: appState.rewards.coinValueCoins,
        coinValueInr: appState.rewards.coinValueInr,
        referralBonus: appState.rewards.referralBonus,
        websitesToVisit: appState.lists.websites,
        socialTasks: appState.lists.socialTasks,
        sliderBanners: appState.banners,
        allowedCountries: appState.country.allowed,
        ipinfoApiToken: appState.country.ipinfoToken,
        blockedCountryMessage: appState.country.blockMessage,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
      await db.collection('config').doc('appNotice').set(appState.notice, { merge: true });
      showToast('💾 All sections saved');
      updateTimestamp();
    } catch (e) {
      showToast('❌ ' + e.message, true);
    }
  };

  // Boot
  loadFromFirebase();
  navigateTo('dashboard');

})();
</script>
</body>
</html>
