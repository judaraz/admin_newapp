<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⭐ Games Hub · Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #0a0e1a;
      color: #eef2f8;
      display: flex;
      min-height: 100vh;
    }
    :root {
      --brand: #00e5a0;
      --brand-2: #00b8d4;
      --brand-3: #7c3aed;
      --card: rgba(20, 27, 51, 0.85);
      --elev: rgba(30, 40, 70, 0.7);
      --border: rgba(0, 229, 160, 0.15);
      --text-dim: #94a3b8;
      --text-mute: #64748b;
      --success: #22c55e;
      --danger: #ef4444;
      --warn: #f59e0b;
    }

    /* SIDEBAR */
    .sidebar {
      width: 250px;
      background: rgba(12, 16, 30, 0.95);
      backdrop-filter: blur(12px);
      border-right: 1px solid var(--border);
      padding: 22px 12px;
      display: flex; flex-direction: column;
      position: sticky; top: 0; height: 100vh;
      overflow-y: auto; flex-shrink: 0;
      box-shadow: 8px 0 30px rgba(0,0,0,0.6);
    }
    .sidebar-brand {
      font-size: 1.4rem; font-weight: 800;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      padding-bottom: 18px; border-bottom: 1px solid #1f2842;
      margin-bottom: 18px;
      display: flex; align-items: center; gap: 10px;
    }
    .sidebar-brand i { -webkit-text-fill-color: var(--brand); font-size: 1.5rem; }
    .nav-section { margin-bottom: 18px; }
    .nav-section-title {
      font-size: 0.6rem; text-transform: uppercase;
      letter-spacing: 1.2px; color: #4a5670;
      padding-left: 12px; margin-bottom: 6px; font-weight: 700;
    }
    .nav-item {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 13px; border-radius: 11px;
      color: #b9c4dd; font-weight: 500;
      transition: 0.2s; cursor: pointer;
      margin-bottom: 3px; text-decoration: none;
      font-size: 0.84rem;
    }
    .nav-item i { width: 20px; font-size: 0.95rem; color: #6b7a9a; text-align: center; transition: 0.2s; }
    .nav-item:hover { background: rgba(0, 229, 160, 0.08); color: white; }
    .nav-item:hover i { color: var(--brand); }
    .nav-item.active {
      background: rgba(0, 229, 160, 0.13);
      color: var(--brand);
      box-shadow: inset 3px 0 0 var(--brand);
    }
    .nav-item.active i { color: var(--brand); }
    .nav-item .badge-count {
      margin-left: auto;
      background: var(--danger);
      color: white;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      min-width: 18px;
      text-align: center;
    }
    .sidebar-footer {
      margin-top: auto;
      border-top: 1px solid #1f2842;
      padding-top: 14px;
      font-size: 0.68rem; color: #4a5670;
      display: flex; flex-direction: column; gap: 5px;
    }
    .live-dot {
      display: inline-block; width: 8px; height: 8px;
      background: var(--success); border-radius: 50%;
      margin-right: 6px; box-shadow: 0 0 12px rgba(34,197,94,0.5);
    }

    /* MAIN */
    .main-content {
      flex: 1; padding: 24px 28px 40px;
      max-width: 1400px; margin: 0 auto; min-width: 0;
    }
    .page-header {
      display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap; gap: 12px;
      margin-bottom: 24px;
    }
    .page-header h1 {
      font-size: 1.6rem; font-weight: 800;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .page-header .sub { color: var(--text-dim); font-size: 0.82rem; margin-top: 2px; }
    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      padding: 18px 20px 22px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px -8px rgba(0,0,0,0.6);
      transition: 0.25s;
      min-width: 0;
    }
    .card:hover { border-color: rgba(0,229,160,0.3); }
    .card h2 {
      font-size: 1rem; font-weight: 700;
      margin-bottom: 14px;
      display: flex; align-items: center; gap: 9px;
      color: var(--brand);
      border-bottom: 1px solid #1f2842;
      padding-bottom: 10px;
    }
    .card h2 i { color: var(--brand); }

    .field-group { display: flex; flex-direction: column; gap: 10px; }
    .field-row {
      display: flex; flex-wrap: wrap; align-items: center;
      gap: 8px 12px;
      background: #0e1325; padding: 8px 12px;
      border-radius: 11px; border: 1px solid #262f47;
    }
    .field-row label {
      font-weight: 500; font-size: 0.78rem;
      color: #b9c4dd; min-width: 90px; flex-shrink: 0;
    }
    .field-row input[type="text"],
    .field-row input[type="number"],
    .field-row input[type="email"],
    .field-row input[type="password"],
    .field-row select,
    .field-row textarea {
      flex: 1; background: transparent; border: none;
      color: white; font-size: 0.86rem; padding: 6px 0;
      outline: none; min-width: 60px; font-family: inherit;
      resize: vertical;
    }
    .field-row input::placeholder, .field-row textarea::placeholder { color: #5b6a8a; }
    .field-row select option { background: #0b0e1a; }

    .switch { display: flex; align-items: center; gap: 8px; }
    .switch input[type="checkbox"] {
      width: 38px; height: 21px; appearance: none;
      background: #2d3650; border-radius: 40px;
      position: relative; cursor: pointer;
      transition: 0.2s; flex-shrink: 0; outline: none;
    }
    .switch input[type="checkbox"]:checked { background: var(--brand); }
    .switch input[type="checkbox"]::after {
      content: ''; position: absolute;
      width: 15px; height: 15px; background: white;
      border-radius: 50%; top: 3px; left: 3px;
      transition: 0.2s;
    }
    .switch input[type="checkbox"]:checked::after { left: 20px; }

    .btn {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      border: none; color: #0a0e1a; font-weight: 700;
      padding: 8px 18px; border-radius: 11px;
      cursor: pointer; transition: 0.2s;
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 0.8rem; font-family: inherit;
      box-shadow: 0 4px 14px rgba(0,229,160,0.3);
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,229,160,0.45); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-outline {
      background: transparent; border: 1px solid var(--brand);
      color: var(--brand); box-shadow: none;
    }
    .btn-outline:hover { background: rgba(0,229,160,0.08); }
    .btn-sm { padding: 5px 12px; font-size: 0.72rem; }
    .btn-xs { padding: 3px 9px; font-size: 0.68rem; border-radius: 8px; }
    .btn-danger {
      background: linear-gradient(135deg, var(--danger), #b91c1c);
      color: white; box-shadow: 0 4px 14px rgba(239,68,68,0.3);
    }
    .btn-danger:hover { box-shadow: 0 6px 18px rgba(239,68,68,0.45); }
    .btn-success {
      background: linear-gradient(135deg, var(--success), #16a34a);
      color: white; box-shadow: 0 4px 14px rgba(34,197,94,0.3);
    }
    .btn-warn {
      background: linear-gradient(135deg, var(--warn), #d97706);
      color: white; box-shadow: 0 4px 14px rgba(245,158,11,0.3);
    }

    .list-item {
      background: #0e1325; border-radius: 11px;
      padding: 10px 13px; margin-bottom: 8px;
      display: flex; flex-wrap: wrap;
      align-items: center; justify-content: space-between;
      border-left: 3px solid var(--brand);
      gap: 8px;
    }
    .list-item .info {
      display: flex; flex-wrap: wrap; gap: 4px 14px;
      font-size: 0.78rem; align-items: center;
    }
    .list-item .info strong { color: var(--brand); }

    .empty-state {
      color: var(--text-mute); font-style: italic;
      padding: 12px; text-align: center; font-size: 0.82rem;
    }

    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 20px;
      font-size: 0.62rem; font-weight: 700;
    }
    .pill-success { background: rgba(34,197,94,0.15); color: #4ade80; }
    .pill-warn { background: rgba(245,158,11,0.15); color: #fbbf24; }
    .pill-danger { background: rgba(239,68,68,0.15); color: #f87171; }
    .pill-info { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .pill-gray { background: rgba(148,163,184,0.15); color: #94a3b8; }

    .toast {
      position: fixed; bottom: 22px; right: 22px;
      background: #1e293b; padding: 12px 22px;
      border-radius: 12px; border-left: 4px solid var(--brand);
      box-shadow: 0 12px 40px rgba(0,0,0,0.7);
      font-weight: 500; display: flex; align-items: center;
      gap: 10px; z-index: 9999;
      transform: translateY(80px); opacity: 0;
      transition: 0.3s ease;
      font-size: 0.84rem; max-width: 340px;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { border-left-color: var(--danger); }
    .toast.error i { color: var(--danger); }

    hr { border:none; border-top:1px solid #1f2842; margin:12px 0; }
    .divider-text {
      color: var(--text-mute); font-size: 0.68rem;
      text-transform: uppercase; letter-spacing: 1px;
      margin: 6px 0; font-weight: 600;
    }

    .order-badge {
      background: rgba(0,229,160,0.15); color: var(--brand);
      width: 24px; height: 24px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 800; flex-shrink: 0;
    }

    /* USERS TABLE */
    .users-toolbar {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin-bottom: 14px; align-items: center;
    }
    .search-input {
      flex: 1; min-width: 180px;
      padding: 10px 14px; border-radius: 11px;
      background: #0e1325; border: 1px solid #262f47;
      color: white; font-family: inherit; font-size: 0.85rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--brand); }

    .users-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 6px;
      font-size: 0.8rem;
    }
    .users-table th {
      text-align: left; padding: 8px 12px;
      color: var(--text-mute); font-weight: 600;
      font-size: 0.68rem; text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .users-table td {
      background: #0e1325; padding: 10px 12px;
      vertical-align: middle;
    }
    .users-table tr td:first-child { border-top-left-radius: 11px; border-bottom-left-radius: 11px; }
    .users-table tr td:last-child { border-top-right-radius: 11px; border-bottom-right-radius: 11px; }
    .user-avatar-cell { display: flex; align-items: center; gap: 10px; }
    .user-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      object-fit: cover; border: 2px solid var(--brand);
      flex-shrink: 0;
    }
    .user-name { font-weight: 600; color: white; font-size: 0.82rem; }
    .user-sub { color: var(--text-mute); font-size: 0.68rem; margin-top: 1px; }

    .user-detail-row {
      display: flex; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px solid #1f2842;
      font-size: 0.82rem;
    }
    .user-detail-row span:first-child { color: var(--text-mute); }
    .user-detail-row span:last-child { color: white; font-weight: 500; text-align: right; }

    /* STATS */
    .stat-big {
      background: #0e1325; border-radius: 14px;
      padding: 16px 18px; border: 1px solid #262f47;
    }
    .stat-big .label {
      color: var(--text-mute); font-size: 0.7rem;
      text-transform: uppercase; letter-spacing: 0.8px;
      margin-bottom: 6px;
    }
    .stat-big .value {
      font-size: 1.7rem; font-weight: 800;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-big .delta { font-size: 0.72rem; color: var(--text-mute); margin-top: 4px; }

    .analytics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    /* WITHDRAWALS */
    .withdraw-row {
      background: #0e1325; border-radius: 11px;
      padding: 12px 14px; margin-bottom: 8px;
      border-left: 3px solid var(--warn);
      display: flex; flex-wrap: wrap;
      gap: 10px; align-items: center;
      justify-content: space-between;
    }
    .withdraw-row.approved { border-left-color: var(--success); }
    .withdraw-row.rejected { border-left-color: var(--danger); }

    /* MODAL */
    .modal-back {
      position: fixed; inset: 0;
      background: rgba(10,14,26,0.9);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center; justify-content: center;
      z-index: 9000; padding: 20px;
      overflow-y: auto;
    }
    .modal-back.show { display: flex; }
    .modal-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 26px 24px;
      max-width: 520px; width: 100%;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7);
      max-height: 90vh; overflow-y: auto;
      position: relative;
    }
    .modal-box h3 {
      font-size: 1.15rem; font-weight: 800;
      color: var(--brand); margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .modal-close {
      position: absolute; top: 14px; right: 16px;
      background: rgba(255,255,255,0.06);
      border: none; color: white;
      width: 30px; height: 30px; border-radius: 50%;
      cursor: pointer; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center;
    }

    /* Payment method row */
    .pm-row {
      display: flex; flex-wrap: wrap; gap: 8px 12px;
      background: #0e1325; padding: 12px 14px;
      border-radius: 11px; border: 1px solid #262f47;
      margin-bottom: 8px;
      align-items: center;
    }
    .pm-row input {
      flex: 1; min-width: 100px;
      background: transparent; border: none;
      color: white; font-size: 0.85rem;
      padding: 6px 0; outline: none; font-family: inherit;
    }
    .pm-row input::placeholder { color: #5b6a8a; }
    .pm-badge {
      background: rgba(0,229,160,0.15); color: var(--brand);
      padding: 3px 9px; border-radius: 8px;
      font-size: 0.68rem; font-weight: 700;
    }

    @media (max-width: 900px) {
      .sidebar { width: 68px; padding: 14px 6px; }
      .sidebar-brand span, .nav-item span,
      .nav-section-title, .sidebar-footer div span:last-child { display: none; }
      .sidebar-brand { justify-content: center; padding-bottom: 12px; }
      .sidebar-brand i { font-size: 1.7rem; }
      .nav-item { justify-content: center; padding: 11px; }
      .nav-item i { font-size: 1.2rem; }
      .nav-section { margin-bottom: 10px; }
      .main-content { padding: 16px 12px; }
      .config-grid { grid-template-columns: 1fr; }
      .page-header h1 { font-size: 1.3rem; }
      .users-table th:nth-child(2), .users-table td:nth-child(2),
      .users-table th:nth-child(4), .users-table td:nth-child(4) { display: none; }
    }
  </style>
</head>

  let usersList = [];

  let pointHistoryList = [];

  // ============ NAV ============
  const pages = ['dashboard','analytics','users','withdrawals','ads','games','rewards','payments','content','banners','notice','messages','country'];

    rewards:     ['Rewards & Coin Values', 'Points earned & conversion rates'],

      case 'users':       renderUsers(c); break;
      case 'withdrawals': renderWithdrawals(c); break;

      case 'country':     renderCountry(c); break;

  // ============ DASHBOARD ============

  // ============ ANALYTICS ============
  let analyticsRange = { type: 'today', from: null, to: null };

  function renderAnalytics(c) {
    const now = new Date();
    const todayStr = dateStr(now);
    const yesterdayStr = dateStr(new Date(now.getTime() - 86400000));

    let fromStr, toStr;
    if (analyticsRange.type === 'today') { fromStr = todayStr; toStr = todayStr; }
    else if (analyticsRange.type === 'yesterday') { fromStr = yesterdayStr; toStr = yesterdayStr; }
    else if (analyticsRange.type === 'week') { fromStr = dateStr(new Date(now.getTime() - 6 * 86400000)); toStr = todayStr; }
    else if (analyticsRange.type === 'month') { fromStr = dateStr(new Date(now.getTime() - 29 * 86400000)); toStr = todayStr; }
    else if (analyticsRange.type === 'custom') { fromStr = analyticsRange.from; toStr = analyticsRange.to; }
    else { fromStr = todayStr; toStr = todayStr; }

    const filtered = pointHistoryList.filter(p => {
      const d = p.timestamp?.seconds ? dateStr(new Date(p.timestamp.seconds * 1000)) : null;
      return d && d >= fromStr && d <= toStr;
    });

    const totalPoints = filtered.reduce((s, p) => s + (p.points || 0), 0);
    const positivePoints = filtered.filter(p => p.points > 0).reduce((s, p) => s + p.points, 0);
    const totalAds = filtered.filter(p => ['ludo_win','color_game','watch_earn','try_luck','visit_site','social_task','g29_win','ludo_win','carrom_win'].includes(p.taskType)).length;
    const uniqueUsers = new Set(filtered.map(p => p.userId)).size;

    const newUsers = usersList.filter(u => {
      const d = u.createdAt?.seconds ? dateStr(new Date(u.createdAt.seconds * 1000)) : null;
      return d && d >= fromStr && d <= toStr;
    }).length;

    const taskTypes = {};
    filtered.forEach(p => { taskTypes[p.taskType] = (taskTypes[p.taskType] || 0) + (p.points || 0); });

    c.innerHTML = `
      <div class="card" style="margin-bottom:20px;">
        <h2><i class="fas fa-calendar"></i> Date Range</h2>
        <div class="users-toolbar">
          <button class="btn btn-sm ${analyticsRange.type==='today'?'':'btn-outline'}" data-range="today">Today</button>
          <button class="btn btn-sm ${analyticsRange.type==='yesterday'?'':'btn-outline'}" data-range="yesterday">Yesterday</button>
          <button class="btn btn-sm ${analyticsRange.type==='week'?'':'btn-outline'}" data-range="week">Last 7 days</button>
          <button class="btn btn-sm ${analyticsRange.type==='month'?'':'btn-outline'}" data-range="month">Last 30 days</button>
          <button class="btn btn-sm ${analyticsRange.type==='custom'?'':'btn-outline'}" data-range="custom">Custom</button>
        </div>
        ${analyticsRange.type === 'custom' ? `
          <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;">
            <input type="date" id="anFrom" class="search-input" value="${analyticsRange.from || todayStr}" style="flex:1; min-width:140px;">
            <input type="date" id="anTo" class="search-input" value="${analyticsRange.to || todayStr}" style="flex:1; min-width:140px;">
            <button class="btn btn-sm" id="anApply">Apply</button>
          </div>
        ` : ''}
        <div style="color:var(--text-mute); font-size:0.75rem; margin-top:12px;">
          Showing: <b style="color:var(--brand);">${fromStr}</b> → <b style="color:var(--brand);">${toStr}</b>
        </div>
      </div>

      <div class="analytics-grid">
        <div class="stat-big"><div class="label">Total Points Given</div><div class="value">${positivePoints.toFixed(0)}</div><div class="delta">Net: ${totalPoints.toFixed(0)}</div></div>
        <div class="stat-big"><div class="label">Ad Views / Tasks</div><div class="value">${totalAds}</div><div class="delta">Completed in range</div></div>
        <div class="stat-big"><div class="label">Active Users</div><div class="value">${uniqueUsers}</div><div class="delta">Unique users w/ activity</div></div>
        <div class="stat-big"><div class="label">New Users</div><div class="value">${newUsers}</div><div class="delta">Joined in range</div></div>
      </div>

      <div class="card" style="margin-top:20px;">
        <h2><i class="fas fa-list"></i> Task Breakdown</h2>
        ${Object.keys(taskTypes).length ? Object.entries(taskTypes).sort((a,b)=>b[1]-a[1]).map(([k, v]) => `
          <div class="user-detail-row">
            <span>${prettyTaskName(k)}</span>
            <span style="color:var(--brand);">${v.toFixed(0)} pts</span>
          </div>
        `).join('') : '<div class="empty-state">No activity in this range</div>'}
      </div>
    `;

    c.querySelectorAll('[data-range]').forEach(btn => {
      btn.onclick = () => { analyticsRange.type = btn.dataset.range; renderAnalytics(c); };
    });
    const apply = document.getElementById('anApply');
    if (apply) {
      apply.onclick = () => {
        analyticsRange.from = document.getElementById('anFrom').value;
        analyticsRange.to = document.getElementById('anTo').value;
        renderAnalytics(c);
      };
    }
  }

      ludoDice_entry: '🎲 Ludo Dice Entry', ludoDice_refund: '🎲 Ludo Dice Refund',

      ad_collect: '💰 Ad Collect', g29_entry: '🃏 29 Entry', g29_win: '🃏 29 Win',
      ludo_entry: '🎲 Ludo Entry', ludo_win: '🎲 Ludo Win',

  // ============ USERS ============
  let userSearchQuery = '';

  let userSortDir = 'desc';

    let filtered = usersList.filter(u => {

        (u.name || '').toLowerCase().includes(q) ||

        String(u.telegramId || '').includes(q)

    filtered.sort((a, b) => {
      let av, bv;

      } else if (userSortKey === 'balance' || userSortKey === 'totalEarned') {
        av = a[userSortKey] || 0; bv = b[userSortKey] || 0;
      } else { av = a[userSortKey] || ''; bv = b[userSortKey] || ''; }
      if (userSortDir === 'desc') return av > bv ? -1 : 1;
      return av < bv ? -1 : 1;

              ${filtered.length ? filtered.slice(0, 200).map(u => `

                  <td><button class="btn btn-xs btn-outline" data-view-user="${u.uid}">View</button></td>
                </tr>
              `).join('') : '<tr><td colspan="6" style="text-align:center; padding:20px; color:var(--text-mute);">No users found</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    `;

    const searchEl = document.getElementById('userSearch');
    searchEl.oninput = (e) => {
      userSearchQuery = e.target.value;
      clearTimeout(searchEl._t);

  // ============ WITHDRAWALS ============

    const approved = withdrawalsList.filter(w => w.status === 'approved');

        </div>

  async function approveWd(id) {
    if (!confirm('Approve this withdrawal?')) return;
    await db.collection('withdrawals').doc(id).update({
      status: 'approved',
      reviewedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    showToast('✅ Withdrawal approved');
  }

  async function rejectWd(id) {
    if (!confirm('Reject this withdrawal? Coins will be refunded to the user.')) return;
    const w = withdrawalsList.find(x => x.id === id);
    if (!w) return;
    await db.collection('withdrawals').doc(id).update({
      status: 'rejected',
      reviewedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    const userRef = db.collection('users').doc(w.userId);
    const userSnap = await userRef.get();
    if (userSnap.exists) {
      const cur = userSnap.data().balance || 0;
      await userRef.update({ balance: cur + (w.amount || 0) });
    }

  function saveGames() {
    const newGames = JSON.parse(JSON.stringify(appState.games));
    document.querySelectorAll('[data-game-visible]').forEach(cb => {
      const k = cb.dataset.gameVisible;
      if (!newGames[k]) newGames[k] = {};
      newGames[k].visible = cb.checked;
    });
    document.querySelectorAll('[data-game-limit]').forEach(inp => {
      const k = inp.dataset.gameLimit;
      if (!newGames[k]) newGames[k] = {};
      newGames[k].dailyPlayLimit = parseInt(inp.value) || 0;
    });
    document.querySelectorAll('[data-game-extra]').forEach(inp => {
      const [k, field] = inp.dataset.gameExtra.split(':');
      if (!newGames[k]) newGames[k] = {};
      newGames[k][field] = parseFloat(inp.value) || 0;
    });
    appState.games = newGames;

      .catch(err => showToast('❌ ' + err.message, true));

  /**
   * Push games to BOTH config/games (miniapp keys) AND config/main (3-game entries).

  function pushGamesToFirebase(games) {
    // config/games — for standard games
    const gamesPayload = {
      ludoDice: { visible: games.ludoDice.visible !== false, dailyPlayLimit: games.ludoDice.dailyPlayLimit || 0, gameCost: games.ludoDice.gameCost || 10, winMultiplier: games.ludoDice.winMultiplier || 10 },
      colorGame: { visible: games.color.visible !== false, dailyPlayLimit: games.color.dailyPlayLimit || 0, rewardPerPlay: games.color.rewardPerPlay || 100 },
      watchVideo: { visible: games.watch.visible !== false, dailyPlayLimit: games.watch.dailyPlayLimit || 0, rewardPerPlay: games.watch.rewardPerPlay || 50 },
      tryYourLuck: { visible: games.luck.visible !== false, dailyPlayLimit: games.luck.dailyPlayLimit || 0, rewardPerPlay: games.luck.rewardPerPlay || 500 },
      socialTasks: { visible: games.social.visible !== false },
      visitWebsites: { visible: games.visit.visible !== false },
      wallet: { visible: games.wallet.visible !== false },
      withdraw: { visible: games.withdraw.visible !== false },
      // 3-game visibility flags
      game29: { visible: games.g29.visible !== false },
      ludoGame: { visible: games.ludo.visible !== false },
      carromGame: { visible: games.carrom.visible !== false },
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    // config/main — for 3-game entry/reward params
    const mainPayload = {
      game29: { entryFee: games.g29.entryFee || 100, winnerReward: games.g29.winnerReward || 180 },
      ludoGame: { entryFee: games.ludo.entryFee || 100, winnerReward: games.ludo.winnerReward || 180 },
      carromGame: { entryFee: games.carrom.entryFee || 100, winnerReward: games.carrom.winnerReward || 180 },
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    return Promise.all([
      db.collection('config').doc('games').set(gamesPayload, { merge: true }),
      db.collection('config').doc('main').set(mainPayload, { merge: true })
    ]);
  }

  async function sendTelegramMsg() {
    const token = appState.bot.token;
    if (!token) return showToast('❌ Bot token missing', true);
    const target = document.getElementById('msgTarget').value;
    const text = document.getElementById('msgText').value.trim();
    if (!text) return showToast('❌ Enter a message', true);

    const statusEl = document.getElementById('msgStatus');
    const btn = document.getElementById('sendMsgBtn');
    btn.disabled = true;

    let targets = [];
    if (target === '__ALL__') targets = usersList.filter(u => u.telegramId && !u.isBlocked);
    else {
      const u = usersList.find(x => x.uid === target);
      if (u && u.telegramId) targets = [u];
    }
    if (!targets.length) {
      statusEl.textContent = 'No valid targets.';
      btn.disabled = false;
      return;
    }

    statusEl.textContent = `Sending to ${targets.length} user(s)…`;
    let sent = 0, failed = 0;

    for (const u of targets) {
      try {
        const r = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: u.telegramChatId || u.telegramId, text, parse_mode: 'HTML' })
        });
        const j = await r.json();
        if (j.ok) sent++; else failed++;
      } catch { failed++; }
      await new Promise(r => setTimeout(r, 60));
    }

    statusEl.textContent = `✅ Sent: ${sent}  •  ❌ Failed: ${failed}`;
    btn.disabled = false;

    try {
      await db.collection('adminMessages').add({
        target: target === '__ALL__' ? 'all' : target,
        targetCount: targets.length,
        text, sent, failed,
        sentAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } catch (e) {}
    showToast(`✅ Message sent to ${sent} user(s)`);
    loadMessageHistory();
  }

  async function loadMessageHistory() {
    const el = document.getElementById('msgHistoryList');
    if (!el) return;
    try {
      const snap = await db.collection('adminMessages').orderBy('sentAt', 'desc').limit(20).get();
      if (snap.empty) { el.innerHTML = '<div class="empty-state">No messages sent yet</div>'; return; }
      const items = [];
      snap.forEach(d => items.push({ id: d.id, ...d.data() }));
      el.innerHTML = items.map(m => {
        const date = m.sentAt?.seconds ? new Date(m.sentAt.seconds*1000).toLocaleString() : '—';
        return `
          <div class="list-item" style="flex-direction:column; align-items:flex-start;">
            <div style="display:flex; justify-content:space-between; width:100%; gap:8px; flex-wrap:wrap;">
              <span style="color:var(--brand); font-weight:700; font-size:0.78rem;">${m.target === 'all' ? '📢 All Users' : '👤 Single User'}</span>
              <span style="color:var(--text-mute); font-size:0.68rem;">${date}</span>
            </div>

            <div style="color:var(--text-mute); font-size:0.68rem; margin-top:6px;">✅ ${m.sent} sent · ❌ ${m.failed} failed</div>
          </div>
        `;

  }

  function setupRealtimeListeners() {
    db.collection('users').onSnapshot(snap => {
      usersList = [];
      snap.forEach(d => usersList.push({ uid: d.id, ...d.data() }));
      if (currentPage === 'users') renderUsers(document.getElementById('pageContainer'));
      else if (currentPage === 'dashboard') renderDashboard(document.getElementById('pageContainer'));
      else if (currentPage === 'analytics') renderAnalytics(document.getElementById('pageContainer'));
    }, err => console.warn('users listener', err));

    db.collection('withdrawals').onSnapshot(snap => {
      withdrawalsList = [];
      snap.forEach(d => withdrawalsList.push({ id: d.id, ...d.data() }));
      withdrawalsList.sort((a, b) => (b.requestedAt?.seconds || 0) - (a.requestedAt?.seconds || 0));
      const pendingCount = withdrawalsList.filter(w => w.status === 'pending').length;
      const badge = document.getElementById('wdBadge');
      if (badge) {
        if (pendingCount > 0) { badge.textContent = pendingCount; badge.style.display = 'inline-block'; }
        else badge.style.display = 'none';
      }
      if (currentPage === 'withdrawals') renderWithdrawals(document.getElementById('pageContainer'));
      else if (currentPage === 'dashboard') renderDashboard(document.getElementById('pageContainer'));
    }, err => console.warn('withdrawals listener', err));

    db.collection('pointHistory').orderBy('timestamp', 'desc').limit(2000).onSnapshot(snap => {
      pointHistoryList = [];
      snap.forEach(d => pointHistoryList.push({ id: d.id, ...d.data() }));
      if (currentPage === 'analytics') renderAnalytics(document.getElementById('pageContainer'));
    }, err => console.warn('pointHistory listener', err));
  }

    el.classList.toggle('error', isError);

    clearTimeout(el._t);

    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // ============ GLOBAL BIND ============
  window.navigateTo = navigateTo;
  document.getElementById('modalBack').onclick = (e) => {
    if (e.target.id === 'modalBack') e.target.classList.remove('show');
  };

  document.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', (e) => { e.preventDefault(); navigateTo(el.dataset.page); });
  });

  document.getElementById('refreshBtn').onclick = () => loadFromFirebase();

  document.getElementById('saveAllBtn').onclick = async () => {
    try {
      await pushGamesToFirebase(appState.games);
      await db.collection('config').doc('ads').set(appState.ads, { merge: true });
      await db.collection('config').doc('main').set({
        adWatchReward: appState.rewards.adWatch,
        colorGameReward: appState.rewards.colorGame,
        ludoGameCost: appState.rewards.ludoGameCost,
        ludoWinMultiplier: appState.rewards.ludoMultiplier,
        tryYourLuckReward: appState.rewards.luckReward,
        socialReward: appState.rewards.socialReward,
        visitReward: appState.rewards.visitReward,
        adRewardPerView: appState.rewards.adRewardPerView,
        minWithdrawal: appState.rewards.minWithdraw,
        coinValueCoins: appState.rewards.coinValueCoins,
        coinValueInr: appState.rewards.coinValueInr,
        referralBonus: appState.rewards.referralBonus,
        websitesToVisit: appState.lists.websites,
        socialTasks: appState.lists.socialTasks,
        paymentMethods: appState.lists.paymentMethods,
        sliderBanners: appState.banners,
        allowedCountries: appState.country.allowed,
        ipinfoApiToken: appState.country.ipinfoToken,
        blockedCountryMessage: appState.country.blockMessage,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
      await db.collection('config').doc('appNotice').set(appState.notice, { merge: true });
      await db.collection('config').doc('bot').set(appState.bot, { merge: true });
      showToast('💾 All saved');
      updateTimestamp();
    } catch (e) { showToast('❌ ' + e.message, true); }
  };

  // ============ BOOT ============
  loadFromFirebase();
  setupRealtimeListeners();
  navigateTo('dashboard');

})();
</script>
</body>
</html>
