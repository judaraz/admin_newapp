<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⭐ CashReward · Premium Admin</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Google Font: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Firebase SDKs (same as miniapp) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #0b0e1a;
      color: #eef2f8;
      display: flex;
      min-height: 100vh;
    }
    /* ----- SIDEBAR NAVIGATION ----- */
    .sidebar {
      width: 260px;
      background: rgba(12, 16, 30, 0.95);
      backdrop-filter: blur(12px);
      border-right: 1px solid rgba(250, 204, 21, 0.15);
      padding: 28px 16px;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      flex-shrink: 0;
      box-shadow: 8px 0 30px rgba(0,0,0,0.6);
    }
    .sidebar-brand {
      font-size: 1.7rem;
      font-weight: 700;
      background: linear-gradient(135deg, #facc15, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      padding-bottom: 24px;
      border-bottom: 1px solid #1f2842;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar-brand i { -webkit-text-fill-color: #facc15; font-size: 1.8rem; }
    .nav-section { margin-bottom: 24px; }
    .nav-section-title {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #6b7a9a;
      padding-left: 12px;
      margin-bottom: 10px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      border-radius: 16px;
      color: #b9c4dd;
      font-weight: 500;
      transition: 0.2s;
      cursor: pointer;
      margin-bottom: 4px;
      text-decoration: none;
    }
    .nav-item i { width: 22px; font-size: 1.1rem; color: #6b7a9a; transition: 0.2s; }
    .nav-item:hover { background: rgba(250, 204, 21, 0.08); color: white; }
    .nav-item:hover i { color: #facc15; }
    .nav-item.active {
      background: rgba(250, 204, 21, 0.15);
      color: #facc15;
      box-shadow: inset 4px 0 0 #facc15;
    }
    .nav-item.active i { color: #facc15; }
    .nav-item .badge {
      margin-left: auto;
      background: #facc15;
      color: #0b0e1a;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 40px;
    }
    .sidebar-footer {
      margin-top: auto;
      border-top: 1px solid #1f2842;
      padding-top: 20px;
      font-size: 0.7rem;
      color: #4a5670;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sidebar-footer .live-dot {
      display: inline-block;
      width: 8px; height: 8px;
      background: #22c55e;
      border-radius: 50%;
      margin-right: 6px;
      box-shadow: 0 0 12px #22c55e88;
    }

    /* ----- MAIN CONTENT ----- */
    .main-content {
      flex: 1;
      padding: 28px 32px 40px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .page-header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #facc15, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .page-header .sub {
      color: #8b9ac0;
      font-size: 0.9rem;
    }
    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 28px;
    }
    .card {
      background: rgba(20, 25, 45, 0.75);
      backdrop-filter: blur(8px);
      border-radius: 28px;
      padding: 20px 24px 28px;
      border: 1px solid rgba(255,215,0,0.08);
      box-shadow: 0 10px 30px -8px rgba(0,0,0,0.6);
      transition: 0.25s ease;
    }
    .card:hover { border-color: rgba(250,204,21,0.25); }
    .card h2 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #facc15;
      border-bottom: 1px solid #2a324a;
      padding-bottom: 12px;
    }
    .card h2 i { color: #facc15; }
    .field-group { display: flex; flex-direction: column; gap: 14px; margin-top: 6px; }
    .field-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      background: #12182b;
      padding: 8px 14px 8px 18px;
      border-radius: 60px;
      border: 1px solid #262f47;
    }
    .field-row label { font-weight: 500; font-size: 0.8rem; color: #b9c4dd; min-width: 80px; }
    .field-row input, .field-row select {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 0.9rem;
      padding: 8px 0;
      outline: none;
      min-width: 80px;
    }
    .field-row input::placeholder { color: #5b6a8a; }
    .field-row select option { background: #0b0e1a; }
    .switch {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .switch input[type="checkbox"] {
      width: 40px; height: 22px;
      appearance: none;
      background: #2d3650;
      border-radius: 40px;
      position: relative;
      cursor: pointer;
      transition: 0.2s;
      flex-shrink: 0;
    }
    .switch input[type="checkbox"]:checked { background: #facc15; }
    .switch input[type="checkbox"]::after {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      background: white;
      border-radius: 50%;
      top: 3px; left: 3px;
      transition: 0.2s;
    }
    .switch input[type="checkbox"]:checked::after { left: 21px; }
    .btn {
      background: #facc15;
      border: none;
      color: #0b0e1a;
      font-weight: 700;
      padding: 8px 20px;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      box-shadow: 0 4px 14px #facc1540;
    }
    .btn:hover { transform: scale(1.02); background: #fbbf24; }
    .btn-outline { background: transparent; border: 1px solid #facc15; color: #facc15; box-shadow: none; }
    .btn-outline:hover { background: #facc1515; }
    .btn-sm { padding: 4px 14px; font-size: 0.7rem; }
    .btn-danger { background: #ef4444; color: white; box-shadow: 0 4px 14px #ef444440; }
    .btn-danger:hover { background: #dc2626; }
    .list-item {
      background: #0e1325;
      border-radius: 40px;
      padding: 10px 16px;
      margin-bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      border-left: 3px solid #facc15;
      gap: 8px;
    }
    .list-item .info { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.8rem; }
    .list-item .info strong { color: #facc15; }
    .empty-state { color: #6b7a9a; font-style: italic; padding: 8px 0; }
    .mt-2 { margin-top: 16px; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .text-gold { color: #facc15; }
    .text-muted { color: #9aa9c9; }
    hr { border-color: #1f2842; margin: 14px 0; }
    .toast {
      position: fixed; bottom: 30px; right: 30px;
      background: #1e293b; padding: 14px 28px;
      border-radius: 60px; border-left: 6px solid #facc15;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7);
      font-weight: 500; display: flex; align-items: center; gap: 12px;
      z-index: 999; transform: translateY(80px); opacity: 0;
      transition: 0.3s ease;
    }
    .toast.show { transform: translateY(0); opacity: 1; }

    /* responsive */
    @media (max-width: 768px) {
      .sidebar { width: 72px; padding: 16px 8px; }
      .sidebar-brand span, .nav-item span, .nav-section-title, .sidebar-footer span, .badge { display: none; }
      .sidebar-brand i { font-size: 2rem; }
      .nav-item { justify-content: center; padding: 12px; }
      .nav-item i { font-size: 1.4rem; }
      .main-content { padding: 16px; }
      .config-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- SIDEBAR NAVIGATION -->
<nav class="sidebar">
  <div class="sidebar-brand">
    <i class="fas fa-crown"></i>
    <span>CashReward</span>
  </div>

  <div class="nav-section">
    <div class="nav-section-title">Main</div>
    <a class="nav-item active" data-page="dashboard"><i class="fas fa-th-large"></i><span>Dashboard</span></a>
    <a class="nav-item" data-page="games"><i class="fas fa-gamepad"></i><span>Games & Limits</span></a>
    <a class="nav-item" data-page="rewards"><i class="fas fa-coins"></i><span>Rewards</span></a>
    <a class="nav-item" data-page="content"><i class="fas fa-link"></i><span>Content Lists</span></a>
  </div>

  <div class="nav-section">
    <div class="nav-section-title">Engagement</div>
    <a class="nav-item" data-page="banners"><i class="fas fa-images"></i><span>Slider Banners</span></a>
    <a class="nav-item" data-page="notice"><i class="fas fa-bullhorn"></i><span>Notice & Referral</span></a>
    <a class="nav-item" data-page="country"><i class="fas fa-globe-americas"></i><span>Country Access</span></a>
  </div>

  <div class="sidebar-footer">
    <div><span class="live-dot"></span> <span id="connStatus">Connected</span></div>
    <div><i class="far fa-clock"></i> <span id="lastUpdate">just now</span></div>
  </div>
</nav>

<!-- MAIN CONTENT -->
<div class="main-content" id="mainContent">
  <!-- header -->
  <div class="page-header">
    <div>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="sub" id="pageSub">Manage your mini‑app from one place</div>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-outline btn-sm" id="refreshBtn"><i class="fas fa-sync-alt"></i> Sync</button>
      <button class="btn btn-sm" id="saveAllBtn"><i class="fas fa-save"></i> Save All</button>
    </div>
  </div>

  <!-- dynamic pages will be rendered here -->
  <div id="pageContainer"></div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"><i class="fas fa-check-circle" style="color:#facc15;"></i> <span id="toastMsg">Saved</span></div>

<script>
  (function() {
    "use strict";

    // ---------- FIREBASE CONFIG (same as miniapp) ----------
    const firebaseConfig = {
      apiKey: "AIzaSyBEvTvWy-hH1HHgjoOhUKkj-Dglm11Oc8U",
      authDomain: "cash-rewards-01-624ae.firebaseapp.com",
      projectId: "cash-rewards-01-624ae",
      storageBucket: "cash-rewards-01-624ae.firebasestorage.app",
      messagingSenderId: "29119912449",
      appId: "1:29119912449:web:e0c68c1994ff0a71603e00"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ---------- STATE (in-memory cache) ----------
    let appState = {
      games: {
        ludo: { visible: true, dailyLimit: 5 },
        color: { visible: true, dailyLimit: 8 },
        watch: { visible: true, dailyLimit: 10 },
        luck: { visible: true, dailyLimit: 3 },
        social: { visible: true },
        visit: { visible: true }
      },
      rewards: {
        adWatch: 50,
        colorGame: 100,
        ludoMultiplier: 10,
        luckReward: 500,
        socialReward: 30,
        visitReward: 15,
        minWithdraw: 1000,
        coinValueCoins: 1000,
        coinValueInr: 10,
        referralBonus: 100
      },
      lists: {
        websites: [
          { name: 'Google', link: 'https://www.google.com', reward: 10, timer: 30 },
          { name: 'YouTube', link: 'https://www.youtube.com', reward: 15, timer: 45 },
          { name: 'Facebook', link: 'https://www.facebook.com', reward: 20, timer: 60 }
        ],
        socialTasks: [
          { name: 'Telegram Channel', link: 'https://t.me/example', reward: 30, icon: 'telegram' },
          { name: 'YouTube Subscribe', link: 'https://youtube.com', reward: 40, icon: 'youtube' }
        ]
      },
      banners: [
        { img: 'https://images.unsplash.com/photo-1611605698335-8b1569810432?q=80&w=400&auto=format&fit=crop', link: '#' },
        { img: 'https://images.unsplash.com/photo-1611224923853-80b023f02d71?q=80&w=400&auto=format&fit=crop', link: '#' },
        { img: 'https://images.unsplash.com/photo-1611605698335-8b1569810432?q=80&w=400&auto=format&fit=crop', link: '#' }
      ],
      country: {
        allowed: ['in', 'us', 'gb'],
        ipinfoToken: '',
        blockMessage: 'Not available in your country'
      },
      notice: { enabled: false, title: '', message: '' }
    };

    // ---------- NAVIGATION ----------
    const pages = ['dashboard', 'games', 'rewards', 'content', 'banners', 'notice', 'country'];
    let currentPage = 'dashboard';

    function navigateTo(page) {
      if (!pages.includes(page)) return;
      currentPage = page;
      // update sidebar
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.querySelector(`.nav-item[data-page="${page}"]`)?.classList.add('active');
      // page title
      const titles = {
        dashboard: 'Dashboard',
        games: 'Games & Limits',
        rewards: 'Rewards & Coins',
        content: 'Content Lists',
        banners: 'Slider Banners',
        notice: 'Notice & Referral',
        country: 'Country Access'
      };
      document.getElementById('pageTitle').textContent = titles[page] || 'Dashboard';
      document.getElementById('pageSub').textContent = page === 'dashboard' ? 'Real‑time admin overview' : 'Manage settings';
      renderPage(page);
    }

    // ---------- RENDER ENGINE ----------
    function renderPage(page) {
      const container = document.getElementById('pageContainer');
      switch(page) {
        case 'dashboard': renderDashboard(container); break;
        case 'games': renderGames(container); break;
        case 'rewards': renderRewards(container); break;
        case 'content': renderContent(container); break;
        case 'banners': renderBanners(container); break;
        case 'notice': renderNotice(container); break;
        case 'country': renderCountry(container); break;
        default: container.innerHTML = '<div class="card"><p>Page not found</p></div>';
      }
    }

    // ---- DASHBOARD ----
    function renderDashboard(container) {
      container.innerHTML = `
        <div class="config-grid">
          <div class="card"><h2><i class="fas fa-chart-line"></i> Quick Stats</h2>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
              <div style="background:#0e1325; border-radius:20px; padding:16px;"><span style="color:#8b9ac0;">Games</span><div style="font-size:1.8rem; font-weight:700; color:#facc15;">6</div></div>
              <div style="background:#0e1325; border-radius:20px; padding:16px;"><span style="color:#8b9ac0;">Websites</span><div style="font-size:1.8rem; font-weight:700; color:#facc15;">${appState.lists.websites.length}</div></div>
              <div style="background:#0e1325; border-radius:20px; padding:16px;"><span style="color:#8b9ac0;">Social Tasks</span><div style="font-size:1.8rem; font-weight:700; color:#facc15;">${appState.lists.socialTasks.length}</div></div>
              <div style="background:#0e1325; border-radius:20px; padding:16px;"><span style="color:#8b9ac0;">Banners</span><div style="font-size:1.8rem; font-weight:700; color:#facc15;">${appState.banners.length}</div></div>
            </div>
            <div style="margin-top:16px; background:#0e1325; border-radius:20px; padding:14px;">
              <span style="color:#8b9ac0;">💎 Min Withdraw</span> <strong class="text-gold">${appState.rewards.minWithdraw}</strong> &nbsp;|&nbsp;
              <span style="color:#8b9ac0;">🪙 ${appState.rewards.coinValueCoins} coins = ₹${appState.rewards.coinValueInr}</span>
            </div>
          </div>
          <div class="card"><h2><i class="fas fa-bolt"></i> Actions</h2>
            <button class="btn" id="quickResetBtn"><i class="fas fa-redo-alt"></i> Reset All Limits (today)</button>
            <button class="btn btn-outline" id="quickNoticeBtn" style="margin-top:10px;"><i class="fas fa-bullhorn"></i> Publish Notice</button>
            <p style="margin-top:14px; font-size:0.8rem; color:#6b7a9a;">Connected to Firebase · changes sync live</p>
          </div>
        </div>
      `;
      document.getElementById('quickResetBtn')?.addEventListener('click', () => resetAllLimits());
      document.getElementById('quickNoticeBtn')?.addEventListener('click', () => navigateTo('notice'));
    }

    // ---- GAMES ----
    function renderGames(container) {
      const g = appState.games;
      container.innerHTML = `
        <div class="card">
          <h2><i class="fas fa-gamepad"></i> Game Visibility & Daily Limits</h2>
          <div class="field-group">
            ${['ludo','color','watch','luck'].map(key => {
              const label = {ludo:'🎲 Ludo Dice', color:'🎨 Color Game', watch:'📺 Watch & Earn', luck:'🍀 Try Luck'}[key];
              return `<div class="field-row">
                <label>${label}</label>
                <div class="switch"><input type="checkbox" data-game="${key}" ${g[key].visible ? 'checked' : ''}><span class="badge-toggle">visible</span></div>
                <input type="number" data-game="${key}" value="${g[key].dailyLimit || 0}" min="0" style="width:60px; text-align:center;" placeholder="limit">
                <span style="font-size:0.7rem; color:#8b9ac0;">/day</span>
              </div>`;
            }).join('')}
            <div class="field-row"><label>📱 Social Tasks</label><div class="switch"><input type="checkbox" data-game="social" ${g.social.visible ? 'checked' : ''}><span class="badge-toggle">visible</span></div></div>
            <div class="field-row"><label>🌐 Visit & Earn</label><div class="switch"><input type="checkbox" data-game="visit" ${g.visit.visible ? 'checked' : ''}><span class="badge-toggle">visible</span></div></div>
            <button class="btn" id="saveGamesBtn"><i class="fas fa-save"></i> Save Games</button>
          </div>
        </div>
      `;
      document.getElementById('saveGamesBtn')?.addEventListener('click', () => {
        document.querySelectorAll('[data-game]').forEach(el => {
          const key = el.dataset.game;
          if (el.type === 'checkbox') {
            appState.games[key].visible = el.checked;
          } else if (el.type === 'number') {
            appState.games[key].dailyLimit = parseInt(el.value) || 0;
          }
        });
        pushToFirebase('games', appState.games);
        showToast('✅ Games & limits saved');
      });
    }

    // ---- REWARDS ----
    function renderRewards(container) {
      const r = appState.rewards;
      container.innerHTML = `
        <div class="card">
          <h2><i class="fas fa-coins"></i> Rewards & Coin Values</h2>
          <div class="field-group">
            ${[
              {key:'adWatch', label:'💰 Ad Watch'},
              {key:'colorGame', label:'🎨 Color Game'},
              {key:'ludoMultiplier', label:'🎲 Ludo Win Multiplier'},
              {key:'luckReward', label:'🍀 Try Luck'},
              {key:'socialReward', label:'📱 Social Task'},
              {key:'visitReward', label:'🌐 Visit Site'}
            ].map(f => `<div class="field-row"><label>${f.label}</label><input type="number" id="rw_${f.key}" value="${r[f.key]}" step="5"></div>`).join('')}
            <hr>
            <div class="field-row"><label>💎 Min Withdraw</label><input type="number" id="rw_minWithdraw" value="${r.minWithdraw}" step="100"></div>
            <div class="field-row"><label>🪙 Coin Value</label><input type="number" id="rw_coinValueCoins" value="${r.coinValueCoins}" step="50" style="width:90px;"> <span style="color:#6b7a9a;">coins = ₹</span> <input type="number" id="rw_coinValueInr" value="${r.coinValueInr}" step="1" style="width:70px;"></div>
            <div class="field-row"><label>🎁 Referral Bonus</label><input type="number" id="rw_referralBonus" value="${r.referralBonus}" step="10"></div>
            <button class="btn" id="saveRewardsBtn"><i class="fas fa-save"></i> Save Rewards</button>
          </div>
        </div>
      `;
      document.getElementById('saveRewardsBtn')?.addEventListener('click', () => {
        const keys = ['adWatch','colorGame','ludoMultiplier','luckReward','socialReward','visitReward','minWithdraw','coinValueCoins','coinValueInr','referralBonus'];
        keys.forEach(k => {
          const el = document.getElementById(`rw_${k}`);
          if (el) appState.rewards[k] = parseFloat(el.value) || 0;
        });
        pushToFirebase('rewards', appState.rewards);
        showToast('✅ Rewards saved');
      });
    }

    // ---- CONTENT LISTS ----
    function renderContent(container) {
      const websites = appState.lists.websites || [];
      const social = appState.lists.socialTasks || [];
      container.innerHTML = `
        <div class="card">
          <h2><i class="fas fa-link"></i> Websites & Social Tasks</h2>
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;">
            <button class="btn btn-sm" id="addWebsiteBtn"><i class="fas fa-plus"></i> Add Website</button>
            <button class="btn btn-sm btn-outline" id="addSocialBtn"><i class="fas fa-plus"></i> Add Social Task</button>
            <button class="btn btn-sm btn-danger" id="resetVisitsBtn"><i class="fas fa-undo-alt"></i> Reset Visits</button>
          </div>
          <div id="websiteListContainer">
            ${websites.length ? websites.map((w,i) => `
              <div class="list-item"><span class="info"><strong>${w.name}</strong> • ${w.reward} coins • ${w.timer}s</span>
              <button class="btn btn-sm btn-danger remove-item" data-type="website" data-idx="${i}"><i class="fas fa-trash"></i></button></div>
            `).join('') : '<div class="empty-state">No websites</div>'}
          </div>
          <div id="socialListContainer" style="margin-top:16px;">
            ${social.length ? social.map((s,i) => `
              <div class="list-item"><span class="info"><strong>${s.name}</strong> • ${s.reward} coins</span>
              <button class="btn btn-sm btn-danger remove-item" data-type="social" data-idx="${i}"><i class="fas fa-trash"></i></button></div>
            `).join('') : '<div class="empty-state">No social tasks</div>'}
          </div>
          <button class="btn" id="saveListsBtn"><i class="fas fa-save"></i> Save Lists</button>
        </div>
      `;
      // add events
      document.getElementById('addWebsiteBtn')?.addEventListener('click', () => {
        const name = prompt('Website name:');
        if (!name) return;
        const link = prompt('URL (https://...):');
        if (!link) return;
        const reward = parseInt(prompt('Reward coins:')) || 10;
        const timer = parseInt(prompt('Timer (seconds):')) || 30;
        appState.lists.websites.push({ name, link, reward, timer });
        renderContent(container);
        showToast('✅ Website added');
      });
      document.getElementById('addSocialBtn')?.addEventListener('click', () => {
        const name = prompt('Task name:');
        if (!name) return;
        const link = prompt('Link:');
        if (!link) return;
        const reward = parseInt(prompt('Reward coins:')) || 20;
        appState.lists.socialTasks.push({ name, link, reward, icon: 'link' });
        renderContent(container);
        showToast('✅ Social task added');
      });
      document.getElementById('resetVisitsBtn')?.addEventListener('click', () => {
        if (confirm('Reset all website visits for today?')) {
          db.collection('config').doc('main').update({ lastWebsiteResetDate: new Date().toISOString().slice(0,10) })
            .then(() => showToast('✅ Visits reset'))
            .catch(() => showToast('❌ Error resetting visits'));
        }
      });
      document.getElementById('saveListsBtn')?.addEventListener('click', () => {
        pushToFirebase('lists', appState.lists);
        showToast('✅ Lists saved');
      });
      // remove events (delegation)
      container.querySelectorAll('.remove-item').forEach(btn => {
        btn.addEventListener('click', function() {
          const type = this.dataset.type;
          const idx = parseInt(this.dataset.idx);
          if (type === 'website') appState.lists.websites.splice(idx, 1);
          else if (type === 'social') appState.lists.socialTasks.splice(idx, 1);
          renderContent(container);
          showToast('🗑️ Removed');
        });
      });
    }

    // ---- BANNERS ----
    function renderBanners(container) {
      const banners = appState.banners || [];
      container.innerHTML = `
        <div class="card">
          <h2><i class="fas fa-images"></i> Slider Banners</h2>
          <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;">
            <input type="text" id="newBannerUrl" placeholder="Image URL" style="flex:2; background:#0e1325; border:1px solid #262f47; border-radius:40px; padding:10px 18px; color:white;">
            <input type="text" id="newBannerLink" placeholder="Link (optional)" style="flex:1; background:#0e1325; border:1px solid #262f47; border-radius:40px; padding:10px 18px; color:white;">
            <button class="btn btn-sm" id="addBannerBtn"><i class="fas fa-plus"></i> Add</button>
          </div>
          <div id="bannerListContainer">
            ${banners.length ? banners.map((b,i) => `
              <div class="list-item"><span class="info"><strong>Banner ${i+1}</strong> <span style="opacity:0.5;">${b.img.substring(0,30)}...</span></span>
              <button class="btn btn-sm btn-danger remove-banner" data-idx="${i}"><i class="fas fa-trash"></i></button></div>
            `).join('') : '<div class="empty-state">No banners</div>'}
          </div>
          <button class="btn" id="saveBannersBtn"><i class="fas fa-save"></i> Save Banners</button>
        </div>
      `;
      document.getElementById('addBannerBtn')?.addEventListener('click', () => {
        const img = document.getElementById('newBannerUrl').value.trim();
        if (!img) { showToast('❌ Enter image URL'); return; }
        const link = document.getElementById('newBannerLink').value.trim() || '#';
        appState.banners.push({ img, link });
        renderBanners(container);
        showToast('✅ Banner added');
      });
      document.getElementById('saveBannersBtn')?.addEventListener('click', () => {
        pushToFirebase('banners', appState.banners);
        showToast('✅ Banners saved');
      });
      container.querySelectorAll('.remove-banner').forEach(btn => {
        btn.addEventListener('click', function() {
          const idx = parseInt(this.dataset.idx);
          appState.banners.splice(idx, 1);
          renderBanners(container);
          showToast('🗑️ Removed');
        });
      });
    }

    // ---- NOTICE & REFERRAL ----
    function renderNotice(container) {
      const n = appState.notice;
      container.innerHTML = `
        <div class="card">
          <h2><i class="fas fa-bullhorn"></i> Notice & Referral</h2>
          <div class="field-group">
            <div class="field-row"><label>🎁 Referral Bonus</label><input type="number" id="refBonus" value="${appState.rewards.referralBonus}" step="10"></div>
            <div class="field-row"><label>📢 App Notice</label>
              <div class="switch"><input type="checkbox" id="noticeEnabled" ${n.enabled ? 'checked' : ''}><span class="badge-toggle">enabled</span></div>
            </div>
            <div class="field-row" style="flex-wrap:wrap; border-radius:20px; padding:12px;">
              <label style="min-width:100%;">Title</label>
              <input type="text" id="noticeTitle" value="${n.title || ''}" placeholder="Important update" style="width:100%;">
              <label style="min-width:100%; margin-top:6px;">Message</label>
              <input type="text" id="noticeMessage" value="${n.message || ''}" placeholder="New features coming!" style="width:100%;">
            </div>
            <button class="btn" id="publishNoticeBtn"><i class="fas fa-broadcast"></i> Publish Notice</button>
            <button class="btn btn-outline" id="dismissNoticeBtn">Dismiss Notice</button>
            <hr>
            <button class="btn btn-danger" id="resetAllBtn"><i class="fas fa-redo-alt"></i> Reset All Limits (today)</button>
          </div>
        </div>
      `;
      document.getElementById('publishNoticeBtn')?.addEventListener('click', () => {
        const title = document.getElementById('noticeTitle').value.trim();
        const message = document.getElementById('noticeMessage').value.trim();
        if (!title || !message) { showToast('❌ Fill title & message'); return; }
        appState.notice.enabled = document.getElementById('noticeEnabled').checked;
        appState.notice.title = title;
        appState.notice.message = message;
        // also update referral bonus
        appState.rewards.referralBonus = parseInt(document.getElementById('refBonus').value) || 100;
        pushToFirebase('notice', appState.notice);
        pushToFirebase('rewards', { referralBonus: appState.rewards.referralBonus });
        showToast('📢 Notice published');
      });
      document.getElementById('dismissNoticeBtn')?.addEventListener('click', () => {
        appState.notice.enabled = false;
        document.getElementById('noticeEnabled').checked = false;
        pushToFirebase('notice', appState.notice);
        showToast('Notice dismissed');
      });
      document.getElementById('resetAllBtn')?.addEventListener('click', resetAllLimits);
    }

    // ---- COUNTRY ----
    function renderCountry(container) {
      const c = appState.country;
      container.innerHTML = `
        <div class="card">
          <h2><i class="fas fa-globe-americas"></i> Country Access</h2>
          <div class="field-group">
            <div class="field-row"><label>🌍 Allowed</label><input type="text" id="allowedCountries" value="${(c.allowed || []).join(',')}" placeholder="in,us,gb"></div>
            <div class="field-row"><label>🔑 IPinfo Token</label><input type="text" id="ipinfoToken" value="${c.ipinfoToken || ''}" placeholder="optional"></div>
            <div class="field-row"><label>🚫 Block Message</label><input type="text" id="blockMessage" value="${c.blockMessage || ''}" placeholder="Not available"></div>
            <button class="btn" id="saveCountryBtn"><i class="fas fa-save"></i> Save Country Settings</button>
          </div>
        </div>
      `;
      document.getElementById('saveCountryBtn')?.addEventListener('click', () => {
        const raw = document.getElementById('allowedCountries').value;
        appState.country.allowed = raw.split(',').map(s => s.trim().toLowerCase()).filter(s => s);
        appState.country.ipinfoToken = document.getElementById('ipinfoToken').value.trim();
        appState.country.blockMessage = document.getElementById('blockMessage').value.trim();
        pushToFirebase('country', appState.country);
        showToast('✅ Country settings saved');
      });
    }

    // ---------- FIREBASE PUSH (sync to miniapp) ----------
    function pushToFirebase(section, data) {
      // we store in config/games, config/main etc to match miniapp
      const ref = db.collection('config').doc('main');
      const payload = {};
      if (section === 'games') payload.games = data;
      else if (section === 'rewards') {
        // merge rewards into main config
        return ref.set({ ...data }, { merge: true }).then(() => {
          showToast('✅ Rewards synced');
        }).catch(err => showToast('❌ Error: ' + err.message));
      } else if (section === 'lists') {
        payload.websitesToVisit = data.websites;
        payload.socialTasks = data.socialTasks;
      } else if (section === 'banners') {
        payload.sliderBanners = data;
      } else if (section === 'notice') {
        // store notice in separate doc
        return db.collection('config').doc('appNotice').set({
          enabled: data.enabled,
          title: data.title,
          message: data.message,
          type: 'info',
          cancelable: true
        }, { merge: true }).then(() => {
          showToast('📢 Notice synced');
        }).catch(err => showToast('❌ Error: ' + err.message));
      } else if (section === 'country') {
        payload.allowedCountries = data.allowed;
        payload.ipinfoApiToken = data.ipinfoToken;
        payload.blockedCountryMessage = data.blockMessage;
      }
      return ref.set(payload, { merge: true }).then(() => {
        showToast(`✅ ${section} synced`);
        updateTimestamp();
      }).catch(err => showToast('❌ Error: ' + err.message));
    }

    // ---------- RESET ALL LIMITS ----------
    function resetAllLimits() {
      if (!confirm('Reset all daily limits for all users?')) return;
      const today = new Date().toISOString().slice(0,10);
      db.collection('config').doc('resetFlags').set({
        full_reset_date: today,
        ludoDice_reset_date: today,
        colorGame_reset_date: today,
        watchVideo_reset_date: today,
        tryYourLuck_reset_date: today
      }, { merge: true }).then(() => {
        showToast('♻️ All limits reset');
      }).catch(() => showToast('❌ Error resetting'));
    }

    // ---------- UTILITIES ----------
    function showToast(msg) {
      const el = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      el.classList.add('show');
      clearTimeout(el._hide);
      el._hide = setTimeout(() => el.classList.remove('show'), 2500);
    }

    function updateTimestamp() {
      const now = new Date().toLocaleTimeString();
      document.getElementById('lastUpdate').textContent = now;
    }

    // ---------- INIT ----------
    // load from firebase on startup
    async function loadFromFirebase() {
      try {
        const mainSnap = await db.collection('config').doc('main').get();
        if (mainSnap.exists) {
          const data = mainSnap.data();
          if (data.games) appState.games = data.games;
          if (data.websitesToVisit) appState.lists.websites = data.websitesToVisit;
          if (data.socialTasks) appState.lists.socialTasks = data.socialTasks;
          if (data.sliderBanners) appState.banners = data.sliderBanners;
          if (data.allowedCountries) appState.country.allowed = data.allowedCountries;
          if (data.ipinfoApiToken) appState.country.ipinfoToken = data.ipinfoApiToken;
          if (data.blockedCountryMessage) appState.country.blockMessage = data.blockedCountryMessage;
          // rewards
          const rewardKeys = ['adWatch','colorGame','ludoMultiplier','luckReward','socialReward','visitReward','minWithdraw','coinValueCoins','coinValueInr','referralBonus'];
          rewardKeys.forEach(k => { if (data[k] !== undefined) appState.rewards[k] = data[k]; });
        }
        // notice
        const noticeSnap = await db.collection('config').doc('appNotice').get();
        if (noticeSnap.exists) {
          const n = noticeSnap.data();
          appState.notice.enabled = n.enabled || false;
          appState.notice.title = n.title || '';
          appState.notice.message = n.message || '';
        }
        updateTimestamp();
        renderPage(currentPage);
        showToast('✅ Synced with Firebase');
      } catch (e) {
        console.warn('Firebase load error, using defaults', e);
        renderPage(currentPage);
      }
    }

    // navigation events
    document.querySelectorAll('.nav-item').forEach(el => {
      el.addEventListener('click', function(e) {
        e.preventDefault();
        const page = this.dataset.page;
        if (page) navigateTo(page);
      });
    });

    // refresh & save all
    document.getElementById('refreshBtn')?.addEventListener('click', () => {
      loadFromFirebase();
    });
    document.getElementById('saveAllBtn')?.addEventListener('click', () => {
      // push all sections
      pushToFirebase('games', appState.games);
      pushToFirebase('lists', appState.lists);
      pushToFirebase('banners', appState.banners);
      pushToFirebase('country', appState.country);
      pushToFirebase('rewards', appState.rewards);
      if (appState.notice.enabled) pushToFirebase('notice', appState.notice);
      showToast('💾 All saved');
    });

    // start
    loadFromFirebase();

    // set initial active page
    navigateTo('dashboard');

  })();
</script>
</body>
</html>
